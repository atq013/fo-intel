# Refresh — re-observes what we already hold and detects real change.
#
# Offset from discover by three hours so the two never contend for the
# Companies House rate limit. Re-fetching produces a content hash; an unchanged
# hash writes nothing, and a changed one is the evidence-based staleness event
# the brief requires. A clock alone is not evidence that anything moved.
name: refresh

on:
  schedule:
    # 05:00 and 17:00 UTC — between discover runs
    - cron: '0 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          REFRESH_BATCH: '40'
        run: npx tsx packages/pipeline/src/jobs/refresh.ts
